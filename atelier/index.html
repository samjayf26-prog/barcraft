<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1F1712">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>BarCraft Atelier — Home Cocktail Companion</title>
  
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" type="image/svg+xml" href="../icons/cocktail.svg">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  
  <link rel="stylesheet" href="../css/atelier.css">
</head>
<body>

  <div class="atelier-app" id="atelierApp">

    <!-- Header Bar -->
    <header class="atelier-header">
      <div class="brand-block" id="headerBrandBlock">
        <div class="brand-crest">🍸</div>
        <div class="brand-text">
          <span class="brand-name">BarCraft</span>
          <span class="brand-tag">Atelier v3.4</span>
        </div>
      </div>
      <div class="header-right">
        <span class="hud-pill stock-pill" id="inStockPillCount">0 in stock</span>
        <button class="hud-btn lab-header-btn" id="craftLabHeaderBtn" title="Open Craft Lab">🧪 Lab</button>
        <button class="hud-btn" id="unitToggleBtn" title="Toggle Units (oz / ml)">oz</button>
        <button class="hud-btn host-mode-btn" id="hostModeBtn" title="Launch Guest Party Menu">🎉 Host</button>
        <a href="../" class="hud-btn classic-link" title="Switch to Classic Standard UI">Classic</a>
      </div>
    </header>

    <!-- ====================================================================
         HUB 1: THE BAR (Search, Styles, Tonight's Pour Deck, & Catalog Grid)
         ==================================================================== -->
    <main id="barHub">
      <!-- Search + Help me choose -->
      <section class="finder-bar">
        <div class="atelier-search-box">
          <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="search"
            id="atelierSearchInput"
            class="atelier-search-input"
            placeholder="Search drinks…"
            aria-label="Search drinks"
            autocomplete="off"
            spellcheck="false"
          >
          <button id="clearSearchBtn" class="clear-search-x" aria-label="Clear search">✕</button>
        </div>
        <button class="choose-btn" id="helpChooseBtn" type="button">
          <span aria-hidden="true">🧭</span> Help me choose
        </button>
      </section>
      <div class="search-hints" id="searchHints" hidden></div>

      <!-- Drink-style filters (counts fill in from app_v3.js) -->
      <section class="style-filter-row" id="styleFilterRow" aria-label="Drink styles"></section>

      <!-- Result count, availability, and view mode -->
      <section class="results-bar">
        <div class="results-summary">
          <span class="results-count" id="resultsCount">0 drinks</span>
          <button class="results-clear" id="clearFiltersBtn" type="button" hidden>Clear</button>
        </div>
        <label class="show-select-wrap">
          <span>Show</span>
          <select id="showFilterSelect" class="show-select" aria-label="Show"></select>
        </label>
        <div class="view-mode-toggle" role="group" aria-label="View">
          <button id="viewModeDeckBtn" class="view-btn active" title="Deck view" aria-label="Deck view">🎴</button>
          <button id="viewModeGridBtn" class="view-btn" title="Grid view" aria-label="Grid view">⊞</button>
        </div>
      </section>

      <!-- Dynamic Bar Content (Deck or Grid) -->
      <section id="barContentContainer"></section>
    </main>

    <!-- ====================================================================
         HUB 2: THE BACKBAR (Inventory, Shopping List, & Unlock Optimizer)
         ==================================================================== -->
    <main id="cabinetHub" style="display: none;">
      <section id="cabinetContainer"></section>
    </main>

    <!-- ====================================================================
         HUB 3: THE ACADEMY (Gamified Drills & Technique Codex)
         ==================================================================== -->
    <main id="academyHub" style="display: none;">
      <section id="academyContainer"></section>
    </main>

  </div> <!-- End .atelier-app -->

  <!-- Floating Action Button: The Craft Lab (Riff Studio) -->
  <button class="atelier-fab" id="craftLabFab" title="Open Craft Lab (Riff or Create Cocktails)" aria-label="Open Craft Lab">
    <span>🧪</span>
    <span class="fab-label">Craft Lab</span>
  </button>

  <!-- ======================================================================
       BOTTOM NAVIGATION BAR (3 Clean Hubs, Safe Area Aware)
       ====================================================================== -->
  <nav class="atelier-bottom-nav" id="atelierBottomNav">
    <button class="nav-hub-btn active" data-hub="bar">
      <span class="nav-hub-icon">🍸</span>
      <span class="nav-hub-label">The Bar</span>
    </button>
    <button class="nav-hub-btn" data-hub="cabinet">
      <span class="nav-hub-icon">🥃</span>
      <span class="nav-hub-label">The Backbar</span>
    </button>
    <button class="nav-hub-btn" data-hub="academy">
      <span class="nav-hub-icon">🎓</span>
      <span class="nav-hub-label">The Academy</span>
    </button>
  </nav>

  <!-- Bartender Focus Mode HUD (Full-screen mixing overlay) -->
  <div class="hud-modal-overlay" id="hudModalOverlay">
    <div class="hud-modal-sheet" id="hudModalSheet">
      <!-- Filled by app_v3.js -->
    </div>
  </div>

  <!-- Guest Party Mode Overlay -->
  <div class="party-mode-overlay" id="partyModeOverlay">
    <div id="partyModeContainer">
      <!-- Filled by app_v3.js -->
    </div>
  </div>

  <!-- Craft Lab Modal (Riff & Custom Drink Studio) -->
  <div class="hud-modal-overlay" id="craftLabModalOverlay">
    <div class="hud-modal-sheet" id="craftLabModalSheet">
      <!-- Filled by app_v3.js -->
    </div>
  </div>

  <!-- Help Me Choose (step-by-step recommender) -->
  <div class="hud-modal-overlay" id="chooserOverlay">
    <div class="hud-modal-sheet chooser-sheet" id="chooserSheet" role="dialog" aria-modal="true" aria-label="Help me choose a drink">
      <!-- Filled by app_v3.js -->
    </div>
  </div>

  <!-- Atelier Toast Container -->
  <div class="atelier-toast-container" id="atelierToastContainer"></div>

  <!-- Service Worker Registration for Offline PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../sw.js').catch(err => {
          console.warn('SW registration:', err);
        });
      });
    }
  </script>

  <!-- Master Application Script -->
  <script type="module" src="../js/app_v3.js"></script>

</body>
</html>
